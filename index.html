<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <title>SL Euphoria Shader</title>
    <style>
        * { margin: 0; padding: 0; overflow: hidden; }
        body, html { width: 100%; height: 100%; background: transparent; }
        
        /* Der Canvas füllt den gesamten Bildschirm */
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            /* Mix-Blend-Mode sorgt für die Farbverschiebung mit der SL-Welt dahinter */
            mix-blend-mode: color-burn; 
            opacity: 0.75; /* Stärke des Effekts (0.0 bis 1.0) */
            pointer-events: none;
        }
    </style>
</head>
<body>

<canvas id="shaderCanvas"></canvas>

<script>
    const canvas = document.getElementById('shaderCanvas');
    const ctx = canvas.getContext('2d');

    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    let time = 0;

    function animate() {
        time += 0.05; // Geschwindigkeit des Trips
        
        const width = canvas.width;
        const height = canvas.height;
        
        // Erzeugt ein dynamisches, psychedelisches Plasmamuster
        const imageData = ctx.createImageData(width, height);
        const data = imageData.data;

        for (let y = 0; y < height; y += 4) { // Schrittweite 4 für bessere Performance in SL
            for (let x = 0; x < width; x += 4) {
                
                // Mathematische Wellen für die Verzerrung und Farbverschiebung
                let v1 = Math.sin(x / 50.0 + time);
                let v2 = Math.sin((y / 50.0 + time) / 2.0);
                let v3 = Math.sin((x + y) / 50.0 + time);
                let cx = x - width / 2;
                let cy = y - height / 2;
                let v4 = Math.sin(Math.sqrt(cx*cx + cy*cy) / 40.0 - time);
                
                let total = v1 + v2 + v3 + v4;
                
                // RGB-Kanäle verschieben (Chromatic Aberration & Farbwechsel)
                let r = Math.sin(total * Math.PI) * 128 + 128;
                let g = Math.cos(total * Math.PI) * 128 + 128;
                let b = Math.sin((total + time) * Math.PI) * 128 + 128;

                // Pixel im 4x4 Block zeichnen (Performance-Optimierung)
                for (let dx = 0; dx < 4; dx++) {
                    for (let dy = 0; dy < 4; dy++) {
                        if (x + dx < width && y + dy < height) {
                            let index = ((y + dy) * width + (x + dx)) * 4;
                            data[index]     = r;   // Rot
                            data[index + 1] = g;   // Grün
                            data[index + 2] = b;   // Blau
                            data[index + 3] = 180; // Alpha/Transparenz des Musters
                        }
                    }
                }
            }
        }

        ctx.putImageData(imageData, 0, 0);
        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
